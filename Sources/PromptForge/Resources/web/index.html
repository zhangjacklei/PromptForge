<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="pf-build" content="demo 2026-11-19 · 3 图 / 2 视频">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提示词锻造台 · PromptForge</title>
<style>
:root {
  --bg: #0e1116;
  --bg2: #12161d;
  --panel: #171c25;
  --panel2: #1d232e;
  --panel3: #232a36;
  --border: #2a3241;
  --border2: #38415250;
  --text: #e7ebf2;
  --text2: #b3bdcc;
  --muted: #7f8b9e;
  --accent: #f0a742;
  --accent2: #5b9dff;
  --ok: #46d39a;
  --warn: #f2c14e;
  --err: #ff6b6b;
  --radius: 10px;
  --shadow: 0 8px 28px #00000040;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f6f8;
    --bg2: #eceef2;
    --panel: #ffffff;
    --panel2: #f7f8fa;
    --panel3: #eef0f4;
    --border: #e0e4ea;
    --border2: #d5dae2;
    --text: #171b22;
    --text2: #414b5a;
    --muted: #6b7688;
    --accent: #c9761b;
    --accent2: #2b6ed9;
    --ok: #0f9d6b;
    --warn: #b07d10;
    --err: #d93a3a;
    --shadow: 0 8px 24px #10182812;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- shell ---------- */
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.topbar {
  display: flex; align-items: center; gap: 18px;
  padding: 12px 22px; border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--bg2), var(--bg));
  flex: 0 0 auto;
}
.brand { display: flex; align-items: baseline; gap: 8px; font-size: 16px; font-weight: 650; letter-spacing: .2px; }
.brand .logo { color: var(--accent); font-size: 15px; }
.brand em { font-style: normal; font-size: 11px; color: var(--muted); letter-spacing: 1.4px; text-transform: uppercase; font-weight: 500; }
.stats { display: flex; gap: 14px; margin-left: auto; font-size: 11.5px; color: var(--muted); }
.stats b { color: var(--text2); font-weight: 600; font-variant-numeric: tabular-nums; }
.stats span { white-space: nowrap; }

.tabs { display: flex; gap: 2px; padding: 0 18px; border-bottom: 1px solid var(--border); background: var(--bg2); flex: 0 0 auto; }
.tabs button {
  background: none; border: 0; padding: 10px 16px 9px; cursor: pointer; color: var(--muted);
  font-size: 13px; border-bottom: 2px solid transparent; transition: .15s;
}
.tabs button:hover { color: var(--text2); }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .spacer { flex: 1; }
.tabs .hint { align-self: center; font-size: 11.5px; color: var(--muted); padding-right: 4px; }

main { flex: 1 1 auto; overflow: hidden; }
.view { height: 100%; overflow: auto; }

/* ---------- generic ---------- */
.btn {
  background: var(--panel3); border: 1px solid var(--border); color: var(--text2);
  padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 12.5px; transition: .14s;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--border2); color: var(--text); background: var(--panel2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #171106; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 3px 9px; font-size: 11.5px; }
.btn:active { transform: translateY(1px); }

input[type=text], input[type=number], select, textarea {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 7px;
  padding: 7px 10px; outline: none; width: 100%; transition: .14s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent2); background: var(--bg2); }
textarea { resize: vertical; line-height: 1.75; }
label.f { display: block; font-size: 11.5px; color: var(--muted); margin: 0 0 5px; letter-spacing: .3px; }

.block { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.block + .block { margin-top: 12px; }
.block-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.block-h h3 { margin: 0; font-size: 12.5px; font-weight: 650; letter-spacing: .4px; color: var(--text2); text-transform: uppercase; }
.block-h .tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); padding: 1px 7px; border-radius: 20px; }
.block-h .right { margin-left: auto; display: flex; gap: 6px; }

.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- tabs panes ---------- */
.compose { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px; padding: 14px 18px 40px; align-items: start; }
@media (max-width: 1180px) { .compose { grid-template-columns: 1fr; } }
.compose-left { min-width: 0; }
.compose-right { position: sticky; top: 14px; display: flex; flex-direction: column; gap: 12px; }

/* ---------- model picker ---------- */
.model-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 900px) { .model-grid { grid-template-columns: repeat(2, 1fr); } }
.model-card {
  border: 1px solid var(--border); background: var(--panel2); border-radius: 9px;
  padding: 10px 11px; cursor: pointer; transition: .15s; position: relative; overflow: hidden;
}
.model-card:hover { border-color: var(--border2); background: var(--panel3); }
.model-card.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.model-card.on::after { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--accent); }
.model-card b { display: block; font-size: 12.8px; font-weight: 650; }
.model-card small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
.model-card .badge { position: absolute; top: 8px; right: 9px; font-size: 9.5px; color: var(--accent); letter-spacing: .5px; }

/* ---------- slot cards ---------- */
.slot { border: 1px solid var(--border); border-radius: 9px; background: var(--panel2); margin-bottom: 10px; overflow: hidden; }
.slot-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel3); border-bottom: 1px solid var(--border); }
.slot-h .name { font-size: 12.5px; font-weight: 650; color: var(--accent); }
.slot-h .cnt { font-size: 10.5px; color: var(--muted); }
.slot-h .fill { margin-left: auto; font-size: 10.5px; padding: 1px 8px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); }
.slot-h .fill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
.slot-b { padding: 10px 12px; }
.slot-b textarea { min-height: 46px; font-size: 12.8px; }
.slot-b .dims { margin-top: 9px; }

/* 维度切换标签 */
.dim-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border); }
.dtab {
  font-size: 11px; padding: 2px 9px; border-radius: 20px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); cursor: pointer; transition: .13s; line-height: 1.7;
}
.dtab:hover { color: var(--text2); border-color: var(--border2); }
.dtab.on { background: color-mix(in srgb, var(--accent) 14%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); color: var(--accent); font-weight: 600; }
.slot-b .chips { padding: 8px 0 2px; min-height: 32px; }

.dims details { border-top: 1px dashed var(--border); padding: 5px 0; }
.dims details:first-child { border-top: 0; }
.dims summary {
  cursor: pointer; font-size: 11.5px; color: var(--muted); list-style: none; padding: 2px 0;
  display: flex; align-items: center; gap: 6px; user-select: none;
}
.dims summary::-webkit-details-marker { display: none; }
.dims summary::before { content: "▸"; font-size: 9px; color: var(--muted); transition: .15s; }
.dims details[open] summary::before { transform: rotate(90deg); }
.dims summary:hover { color: var(--text2); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 7px 0 4px; }
.chip {
  font-size: 11.5px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text2); cursor: pointer; transition: .12s; line-height: 1.6;
}
.chip:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
.chip:active { transform: scale(.96); }

/* ---------- modifier rows ---------- */
.mod-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--border); }
.mod-row:first-of-type { border-top: 0; }
.mod-row > label { width: 62px; flex: 0 0 62px; font-size: 12px; color: var(--text2); padding-top: 7px; }
.mod-row .mod-main { flex: 1; min-width: 0; }
.mod-row input[type=text] { padding: 6px 9px; font-size: 12.5px; }
.mod-row .mini-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.mod-row .mini-chips .chip { font-size: 11px; padding: 1px 7px; }
.mod-row.dim { opacity: .45; }

/* ---------- preview ---------- */
.pv-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.pv-head h3 { margin: 0; font-size: 12.5px; letter-spacing: .4px; text-transform: uppercase; color: var(--text2); font-weight: 650; }
.pv-head .len { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
#pv-text { min-height: 190px; font-size: 13px; line-height: 1.85; background: var(--bg2); }
.pv-actions { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
.pv-actions .btn { flex: 1; justify-content: center; }
.pv-actions.inline .btn { flex: 0 0 auto; }
.howto { display: flex; flex-direction: column; gap: 9px; font-size: 12.5px; color: var(--text2); }
.howto div { display: flex; gap: 9px; align-items: flex-start; }
.howto b { flex: 0 0 18px; height: 18px; border-radius: 5px; background: var(--panel3); color: var(--accent); font-size: 11px; display: grid; place-items: center; margin-top: 2px; }
#ing-out { min-height: 240px; }
.pv-actions.inline .btn { flex: 0 0 auto; }
.howto { display: flex; flex-direction: column; gap: 9px; font-size: 12.5px; color: var(--text2); }
.howto div { display: flex; gap: 9px; align-items: flex-start; }
.howto b { flex: 0 0 18px; height: 18px; border-radius: 5px; background: var(--panel3); color: var(--accent); font-size: 11px; display: grid; place-items: center; margin-top: 2px; }
#ing-out { min-height: 240px; }

.params { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 10px; }
.params .p { background: var(--panel2); border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; }
.params .p em { display: block; font-style: normal; font-size: 10px; color: var(--muted); letter-spacing: .4px; }
.params .p b { font-size: 12.5px; font-weight: 600; font-family: var(--mono); letter-spacing: -.2px; }
.params .p.wide { grid-column: span 2; }

/* ---------- lint ---------- */
.lint-item { display: flex; gap: 8px; padding: 7px 0; border-top: 1px dashed var(--border); font-size: 12px; }
.lint-item:first-child { border-top: 0; }
.lint-item .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; flex: 0 0 6px; }
.lint-item .dot.err { background: var(--err); box-shadow: 0 0 0 3px color-mix(in srgb, var(--err) 18%, transparent); }
.lint-item .dot.warn { background: var(--warn); }
.lint-item .dot.info { background: var(--accent2); }
.lint-item .dot.ok { background: var(--ok); }
.lint-item .msg { flex: 1; color: var(--text2); }
.lint-item .msg i { font-style: normal; color: var(--muted); display: block; font-size: 11px; margin-top: 2px; }
.lint-item .fix { flex: 0 0 auto; }

.score-bar { height: 6px; border-radius: 4px; background: var(--panel3); overflow: hidden; margin: 8px 0 10px; }
.score-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .35s; }
.score-num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
.score-num small { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.score-detail { font-size: 11.5px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.score-detail span { display: flex; justify-content: space-between; }

/* ---------- table / list ---------- */
.toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--bg2); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
.toolbar input[type=text] { max-width: 260px; }
.toolbar select { max-width: 150px; }
.toolbar .n { font-size: 11.5px; color: var(--muted); margin-left: auto; white-space: nowrap; }

.list { padding: 12px 18px 48px; display: grid; gap: 8px; }
@media (min-width: 1500px) { .list { grid-template-columns: 1fr 1fr; } }
.card {
  border: 1px solid var(--border); border-radius: 9px; background: var(--panel);
  padding: 11px 13px; transition: .14s;
}
.card:hover { border-color: var(--border2); background: var(--panel2); }
.card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.card-h .id { font-family: var(--mono); font-size: 11px; color: var(--accent); }
.card-h .nm { font-size: 13px; font-weight: 600; }
.card-h .sc { margin-left: auto; font-size: 10.5px; width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-weight: 700; }
.sc.A { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
.sc.B { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.sc.C { background: color-mix(in srgb, var(--err) 20%, transparent); color: var(--err); }
.card .p { font-size: 12.2px; color: var(--text2); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-f { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.pill { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px; }
.card-f .btn { margin-left: auto; }
.card-f .btn + .btn { margin-left: 0; }

/* ---------- lexicon ---------- */
.lex { padding: 14px 18px 48px; display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 10px; }
.lex-card { border: 1px solid var(--border); border-radius: 9px; background: var(--panel); padding: 12px 14px; }
.lex-card h4 { margin: 0 0 8px; font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
.lex-card h4 .sl { font-size: 10px; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border)); padding: 0 7px; border-radius: 20px; }
.lex-card h4 .cw { margin-left: auto; font-size: 10.5px; color: var(--muted); font-weight: 400; }

/* ---------- ingest ---------- */
.ingest { padding: 14px 18px 48px; display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 14px; align-items: start; }
@media (max-width: 1100px) { .ingest { grid-template-columns: 1fr; } }
#raw { min-height: 190px; font-size: 12.8px; font-family: var(--mono); }
.analyze-out { font-size: 12.5px; }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 6px 10px; font-size: 12.5px; }
.kv em { font-style: normal; color: var(--muted); }
.dup { border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; margin-top: 6px; background: var(--panel2); font-size: 12px; }
.dup .sim { float: right; font-family: var(--mono); font-size: 11px; color: var(--warn); }

/* ---------- blueprint ---------- */
.doc { max-width: 900px; margin: 0 auto; padding: 22px 24px 80px; }
.doc h2 { font-size: 19px; margin: 34px 0 12px; letter-spacing: -.2px; }
.doc h2:first-child { margin-top: 4px; }
.doc h3 { font-size: 14px; margin: 22px 0 8px; color: var(--text); }
.doc p, .doc li { font-size: 13.2px; color: var(--text2); line-height: 1.85; }
.doc ul, .doc ol { padding-left: 20px; }
.doc code { font-family: var(--mono); font-size: 12px; background: var(--panel3); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); }
.doc .lead { font-size: 14px; color: var(--text2); border-left: 2px solid var(--accent); padding-left: 14px; margin: 0 0 20px; }
.doc table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 12px 0; }
.doc th, .doc td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
.doc th { background: var(--panel3); font-weight: 600; color: var(--text2); font-size: 12px; }
.doc td { color: var(--text2); }
.doc .callout { border: 1px solid var(--border); border-left: 3px solid var(--accent2); background: var(--panel); border-radius: 8px; padding: 12px 16px; margin: 14px 0; }
.doc .callout b { color: var(--text); }

/* ---------- misc ---------- */
.empty { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 13px; }
.toast {
  position: fixed; bottom: 26px; left: 50%; transform: translate(-50%, 20px);
  background: var(--panel3); border: 1px solid var(--border2); color: var(--text);
  padding: 9px 18px; border-radius: 8px; font-size: 12.5px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: .22s; z-index: 99;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.hide { display: none !important; }
kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }

/* =========================================================================
 * v2 新增
 * ========================================================================= */
.hintline { font-size: 11.8px; color: var(--muted); line-height: 1.7; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.pad { padding: 14px 18px 60px; }
.pad > .block + .block { margin-top: 12px; }
ul.tiny { margin: 4px 0 0; padding-left: 18px; font-size: 12px; color: var(--text2); line-height: 1.75; }
ul.tiny.muted li { color: var(--muted); }

/* 二级页签 */
.seg-tabs { display: inline-flex; gap: 3px; background: var(--panel3); padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
.seg-tabs .st {
  background: none; border: 0; padding: 4px 12px; border-radius: 6px; cursor: pointer;
  color: var(--muted); font-size: 12px; transition: .14s;
}
.seg-tabs .st:hover { color: var(--text2); }
.seg-tabs .st.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px #0003; font-weight: 600; }
.seg-tabs .st em { font-style: normal; font-size: 10px; color: var(--accent); margin-left: 4px; }
.toolbar.sub { top: 42px; border-top: 1px solid var(--border); background: var(--bg); }

/* 折叠块 */
.fold { padding: 0; overflow: hidden; }
.fold > summary {
  cursor: pointer; list-style: none; padding: 12px 16px; display: flex; align-items: center; gap: 8px;
  user-select: none;
}
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before { content: "▸"; font-size: 10px; color: var(--muted); transition: .15s; }
.fold[open] > summary::before { transform: rotate(90deg); }
.fold > summary h3 { margin: 0; font-size: 12.5px; font-weight: 650; letter-spacing: .4px; color: var(--text2); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.fold > div { padding: 0 16px 14px; }

/* 弹层 */
.modal {
  position: fixed; inset: auto 20px 20px 20px; max-height: 74vh; overflow: auto; z-index: 80;
  box-shadow: var(--shadow); background: var(--panel);
}
.modal.wide { inset: auto; top: 6vh; left: 50%; transform: translateX(-50%); width: min(900px, 94vw); max-height: 86vh; overflow: auto; }
@media (max-width: 900px) { .modal.wide { inset: 12px; } }

/* 输入行 */
.form-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
.form-row input { flex: 1; min-width: 0; padding: 5px 9px; font-size: 12px; }
.form-row select { flex: 0 0 68px; padding: 5px 6px; font-size: 12px; }
.check { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); cursor: pointer; }
.chip.check { padding: 2px 9px; }
.chip.check input { width: auto; margin: 0; accent-color: var(--accent); }
.chip.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.chip b { font-weight: 600; opacity: .7; margin-left: 2px; }

/* 统计块 */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.stat { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
.stat b.err { color: var(--err); } .stat b.warn { color: var(--warn); }
.stat b.info { color: var(--accent2); } .stat b.ok { color: var(--ok); }
.stat em { font-style: normal; font-size: 11px; color: var(--muted); }

/* 表格 */
.tbl-wrap { overflow: auto; max-height: 56vh; border: 1px solid var(--border); border-radius: 8px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { position: sticky; top: 0; background: var(--panel3); text-align: left; padding: 7px 10px; font-weight: 600; color: var(--text2); border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text2); vertical-align: top; }
.tbl tr:hover td { background: var(--panel2); }
.lv { font-size: 10px; padding: 0 6px; border-radius: 4px; font-family: var(--mono); }
.lv.err { background: color-mix(in srgb, var(--err) 18%, transparent); color: var(--err); }
.lv.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.lv.info { background: color-mix(in srgb, var(--accent2) 18%, transparent); color: var(--accent2); }

/* 版本 / 产出 */
.ver-row { display: flex; align-items: center; gap: 7px; padding: 5px 0; border-top: 1px dashed var(--border); font-size: 11.8px; }
.ver-row:first-child { border-top: 0; }
.ver-row .vt { font-family: var(--mono); font-size: 10.5px; color: var(--accent); min-width: 26px; }
.ver-row .vt.S { color: var(--ok); } .ver-row .vt.A { color: var(--accent2); }
.ver-row .vt.B { color: var(--warn); } .ver-row .vt.C { color: var(--err); }
.ver-row .vm { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ver-row .vs { font-family: var(--mono); color: var(--text2); }
.ver-row .btn { padding: 2px 7px; font-size: 11px; }

/* diff */
.diff-block { border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; overflow: hidden; }
.diff-h { background: var(--panel3); padding: 6px 11px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.diff-body { padding: 9px 11px; font-size: 12.5px; line-height: 1.9; color: var(--text2); white-space: pre-wrap; word-break: break-word; }
.diff-body.mono { font-family: var(--mono); font-size: 11.8px; }
.diff-body ins { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); text-decoration: none; border-radius: 3px; padding: 0 1px; }
.diff-body del { background: color-mix(in srgb, var(--err) 20%, transparent); color: var(--err); border-radius: 3px; padding: 0 1px; }
.pill.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, var(--border)); }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
.pill.dim { opacity: .72; }
.pill.m-z-turbo { color: #f0a742; border-color: #f0a74260; }
.pill.m-z-base { color: #5b9dff; border-color: #5b9dff60; }
.pill.m-z-edit { color: #b07bff; border-color: #b07bff60; }
.pill.m-h3 { color: #46d39a; border-color: #46d39a60; }
.pill.m-sdxl { color: #9aa7bb; border-color: #9aa7bb60; }

/* 采集：拖拽区 / 队列 */
.drop {
  margin-top: 9px; border: 1px dashed var(--border2); border-radius: 8px; padding: 12px 14px;
  font-size: 11.8px; color: var(--muted); text-align: center; cursor: pointer; transition: .15s; line-height: 1.7;
}
.drop:hover, .drop.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.drop b { color: var(--text); }
.q-item { border: 1px solid var(--border); border-left-width: 2px; border-radius: 7px; padding: 7px 9px; margin-top: 6px; background: var(--panel2); }
.q-item.ok { border-left-color: var(--ok); }
.q-item.no { border-left-color: var(--err); opacity: .8; }
.q-item.pending { border-left-color: var(--warn); }
.q-h { display: flex; align-items: center; gap: 6px; font-size: 11.8px; }
.q-st { font-size: 10px; padding: 0 6px; border-radius: 4px; }
.q-st.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.q-st.no { background: color-mix(in srgb, var(--err) 18%, transparent); color: var(--err); }
.q-st.pending { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.q-sc { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: auto; }
.q-p { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.6; }
.q-note { font-size: 11px; color: var(--warn); margin-top: 3px; }
.q-item .pv-actions { margin-top: 6px; }

/* 缺口 */
.gap-bars { display: flex; flex-direction: column; gap: 5px; }
.gap-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
.gap-row .gl { width: 62px; color: var(--text2); flex: 0 0 62px; }
.gap-row .gb { flex: 1; height: 6px; background: var(--panel3); border-radius: 4px; overflow: hidden; }
.gap-row .gb i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
.gap-row .gn { width: 26px; text-align: right; font-family: var(--mono); color: var(--muted); font-size: 10.5px; }
.cadence { margin-top: 12px; font-size: 11.5px; color: var(--text2); background: var(--panel2); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; }

/* 负向映射 */
.neg-card {
  border: 1px solid var(--border); border-radius: 7px; background: var(--panel2); padding: 7px 10px;
  display: flex; align-items: center; gap: 8px; font-size: 11.8px; cursor: pointer; transition: .12s;
}
.neg-card:hover { border-color: var(--accent2); background: var(--panel3); }
.neg-card .neg-k { color: var(--err); min-width: 0; }
.neg-card .arrow { color: var(--muted); font-size: 10px; }
.neg-card .neg-v { color: var(--ok); flex: 1; min-width: 0; }
#neg-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }

/* 实验 */
.ab-dim { margin-top: 10px; }
.ab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 9px; }
.ab-cell { border: 1px solid var(--border); border-radius: 8px; background: var(--panel2); padding: 9px 11px; }
.ab-h { font-size: 11.8px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
.ab-p { font-size: 11.5px; color: var(--text2); line-height: 1.65; margin-bottom: 7px; }
.rate { display: flex; gap: 3px; margin-bottom: 6px; }
.rate button {
  width: 26px; height: 22px; border-radius: 5px; border: 1px solid var(--border);
  background: var(--panel); color: var(--muted); font-size: 11px; cursor: pointer;
}
.rate button:hover { border-color: var(--accent); color: var(--accent); }
.rate button.on { background: var(--accent); border-color: var(--accent); color: #171106; font-weight: 700; }

/* 库列表加宽 */
.list.wide { grid-template-columns: 1fr; }
.kv.small { font-size: 11.8px; grid-template-columns: 44px 1fr; gap: 5px 10px; }
.kv.small .fixtext { color: var(--ok); }
.st-badge { font-size: 10.5px; padding: 1px 8px; border-radius: 20px; border: 1px solid var(--border); white-space: nowrap; }
.st-badge.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.st-badge.part { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); background: color-mix(in srgb, var(--warn) 10%, transparent); }

/* =========================================================================
 * v3 新增：长度预算 / 模板导出 / 相似反查 / 断言套件 / 竞品页 / 命令面板
 * ========================================================================= */

/* ---------- 顶栏 ⌘K ---------- */
.kbd-hint {
  margin-left: auto; font-size: 12px; color: var(--muted);
  border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px;
  cursor: pointer; user-select: none; background: var(--panel2);
}
.kbd-hint:hover { color: var(--text); border-color: var(--accent2); }

/* ---------- 长度预算 ---------- */
.lenbar {
  height: 8px; border-radius: 4px; background: var(--panel3); overflow: hidden;
  border: 1px solid var(--border);
}
.lenbar i { display: block; height: 100%; width: 0; transition: width .18s, background .18s; background: var(--ok); }
.lenbar i.over { box-shadow: inset 0 0 0 1px var(--err); }
.len-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }

/* ---------- 模板导出 ---------- */
.tpl-box { margin-top: 8px; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; background: var(--panel2); }
.tpl-tag { font: 11px/1 var(--mono); color: var(--accent); margin-bottom: 6px; }
.tpl-text {
  width: 100%; resize: vertical; background: var(--bg2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.55;
}
.tpl-vars { margin-top: 8px; display: grid; gap: 3px; }
.tpl-vars div { font-size: 11.5px; color: var(--text2); word-break: break-all; }

/* ---------- 相似反查 ---------- */
.sim-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  border-bottom: 1px dashed var(--border); font-size: 12.5px;
}
.sim-row:last-child { border-bottom: 0; }
.sim-p { font: 700 12px/1 var(--mono); color: var(--accent); min-width: 40px; }
.sim-id { color: var(--muted); min-width: 48px; }
.sim-n {
  flex: 1; min-width: 0; color: var(--text2); font-size: 12.5px; line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.sim-row .btn { flex: 0 0 auto; }

/* ---------- 断言套件 ---------- */
.as-sum { display: flex; gap: 26px; flex-wrap: wrap; padding: 4px 0 10px; }
.as-big { display: flex; flex-direction: column; }
.as-big b { font: 700 24px/1.1 var(--mono); color: var(--ok); }
.as-big.err b { color: var(--err); }
.as-big span { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.as-bar { display: inline-block; width: 76px; height: 6px; border-radius: 3px; background: var(--panel3); overflow: hidden; vertical-align: middle; margin-right: 6px; }
.as-bar i { display: block; height: 100%; background: var(--ok); }
.as-bar.warn i { background: var(--warn); }
.as-bar.err i { background: var(--err); }
.as-row { cursor: pointer; }
.as-row:hover td { background: var(--panel2); }
.as-fails { display: flex; flex-wrap: wrap; gap: 6px; max-height: 260px; overflow: auto; }
.as-f {
  font: 11.5px/1.6 var(--mono); color: var(--text2); background: var(--panel2);
  border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; cursor: pointer;
}
.as-f:hover { border-color: var(--accent2); color: var(--text); }

/* ---------- 竞品页 ---------- */
.bsc {
  display: inline-block; min-width: 24px; text-align: center; font: 700 12px/1.75 var(--mono);
  border-radius: 5px; padding: 0 5px;
}
.bsc1 { background: #ff6b6b26; color: var(--err); }
.bsc2 { background: #ff6b6b1a; color: var(--err); }
.bsc3 { background: #f2c14e1f; color: var(--warn); }
.bsc4 { background: #5b9dff1f; color: var(--accent2); }
.bsc5 { background: #46d39a26; color: var(--ok); }

/* 竞品页 / 断言页的表格（这两页的表格不在 .doc 里） */
.tbl-wrap table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl-wrap th, .tbl-wrap td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: middle; }
.tbl-wrap th { background: var(--panel3); color: var(--text2); font-weight: 600; font-size: 12px; position: sticky; top: 0; z-index: 2; }
.tbl-wrap tr:last-child td { border-bottom: 0; }
.tbl-wrap tbody tr:hover td, .tbl-wrap tr:hover td { background: var(--panel2); }
.tbl-wrap td.nowrap { white-space: nowrap; }
.self-row td { background: #f0a74212; }
.self-row td:first-child { border-left: 2px solid var(--accent); }
.bench-card { margin-bottom: 10px; }
.bench-sc { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; margin: 4px 0 8px; color: var(--text2); }
.bench-body p { margin: 4px 0; font-size: 13px; line-height: 1.6; }
.bench-body .lab {
  display: inline-block; min-width: 40px; margin-right: 8px; font-size: 11.5px;
  color: var(--muted); font-weight: 600;
}
.bench-body .win { color: var(--ok); }
.bench-body .lose { color: var(--err); }
.bench-ol, .bench-ul { margin: 6px 0 0; padding-left: 20px; }
.bench-ol li, .bench-ul li { margin: 6px 0; font-size: 13px; line-height: 1.65; }
.gap-card { margin-top: 10px; }
.gap-card p { margin: 4px 0; font-size: 13px; line-height: 1.65; }
.gap-card .why { color: var(--text2); background: var(--panel2); border-left: 2px solid var(--accent); padding: 7px 10px; border-radius: 0 6px 6px 0; }
.gap-card .why b { color: var(--accent); margin-right: 8px; }
.tone-gap { color: var(--accent); }
.tone-rare { color: var(--accent2); }
.tone-hot { color: var(--muted); }

/* ---------- 能力矩阵 ---------- */
.cap-tbl th.cap-h {
  font-size: 11px; writing-mode: vertical-rl; text-orientation: mixed;
  height: 108px; vertical-align: bottom; padding: 6px 2px; white-space: nowrap;
}
.cap { text-align: center; font-size: 14px; line-height: 1; padding: 7px 2px; }
.cap0 { color: var(--muted); opacity: .38; }
.cap1 { color: var(--warn); }
.cap2 { color: var(--ok); }

/* ---------- 检索直达 ---------- */
.linkrow { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
.site-link {
  font-size: 12px; color: var(--accent2); text-decoration: none;
  border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; background: var(--panel2);
}
.site-link:hover { border-color: var(--accent2); background: var(--panel3); }

/* ---------- 命令面板 ---------- */
.palette { position: fixed; inset: 0; z-index: 90; }
.palette.hide { display: none; }
.pal-bg { position: absolute; inset: 0; background: #00000066; backdrop-filter: blur(2px); }
.pal {
  position: relative; width: min(680px, 92vw); margin: 12vh auto 0;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 24px 60px #00000055; overflow: hidden;
}
.pal input {
  width: 100%; border: 0; border-bottom: 1px solid var(--border);
  background: transparent; padding: 14px 18px; font-size: 15px; outline: none;
}
.pal-list { max-height: 52vh; overflow: auto; padding: 6px; }
.pal-row {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border-radius: 7px; cursor: pointer; font-size: 13px;
}
.pal-row.on { background: var(--panel3); }
.pal-t {
  font: 10px/1.6 var(--mono); min-width: 20px; text-align: center;
  color: var(--accent); background: #f0a7421a; border-radius: 4px; padding: 1px 4px;
}
.pal-n { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-s { font-size: 11.5px; color: var(--muted); max-width: 44%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-foot {
  display: flex; gap: 16px; padding: 8px 16px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--muted);
}

@media (max-width: 900px) {
  .cap-tbl th.cap-h { height: 84px; font-size: 10px; }
  .as-sum { gap: 16px; }
}

/* 能力矩阵：不限制高度，整表直出 */
.cap-wrap { max-height: none; }
.cap-wrap th, .cap-wrap td { padding: 6px 4px; }
.cap-wrap td:first-child, .cap-wrap th:first-child { padding-left: 12px; }

/* 相似 / 配方列表：单列，不用双列网格 */
.sim-wrap, .pre-wrap { margin-top: 6px; }
.sim-wrap .empty, .pre-wrap .empty { padding: 18px 6px; text-align: left; }
.sim-row { padding: 7px 2px; }

/* 模板语法切换：短标签，允许换行不溢出 */
#tpl-tabs { flex-wrap: wrap; gap: 6px; }
#tpl-tabs button { font-size: 11.5px; padding: 4px 8px; }

#tpl-tabs button {
  border: 1px solid var(--border); border-radius: 999px; background: var(--panel2); color: var(--text2);
}
#tpl-tabs button.on { border-color: var(--accent); color: var(--accent); background: #f0a74214; }

.as-big.mut b { color: var(--muted); }

/* 从库载入：条目多，给宽一点 */
.load-cell { flex: 1.7 !important; }
.load-cell select { font-size: 12px; }

</style>
</head>

  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="logo">◆</span>提示词锻造台<em>PromptForge</em></div>
      <div class="stats" id="stats"></div>
    </header>
    <nav class="tabs" id="tabs">
      <button data-tab="compose" class="active">装配</button>
      <button data-tab="lexicon">词库</button>
      <button data-tab="library">库</button>
      <button data-tab="ingest">采集</button>
      <button data-tab="lab">实验</button>
      <button data-tab="bench">竞品</button>
      <button data-tab="plan">方案</button>
    </nav>
    <main><div class="view" id="view"></div></main>

  // 视频专属的非槽位标签（声音/台词/运镜/时长属于段落，不做实体槽位）
  const NON_SLOT_TAGS = ['颜色', '台词', '台词一', '台词二', '声音', '环境音', '环境声音',
    '移动', '动作', '竖屏', '时长', '语言', '音乐风格', '一句台词', '场景环境音'];

  const TAG_L1 = [

  const TAG_L2 = [

  // L1 → 默认 L2（避免二级落空）
  const L1_L2 = {

    '动物': '摄影写真', '概念幻想': '概念设定', '插画漫画': '插画创作', '视频叙事': '短视频'

  const TAG_L3 = [
    ['东方美学', /国风|古风|水墨|敦煌|江南|宫廷|仙侠|武侠|旗袍|壁画|非遗|文化|写意|宋式/],
    ['未来亚文化', /赛博|霓虹|科幻|太空|蒸汽朋克|废土|哥特|机甲|异色瞳/],
    ['日系清新', /日系|清透|温柔|甜美|青春|清新|居家|田园|北欧/],
    ['胶片复古', /胶片|复古|水乡|纪实|老照片|印象派/],
    ['电影光效', /电影感|光影|高调|丝绒|冷艳|氛围|情绪|夜景/],
    ['绘画艺术', /水彩|油画|素描|黑白|艺术|抽象|壁画|漫画|国风写意/],
    ['二次元', /二次元|动漫|漫画|赛璐璐|吉卜力|洛丽塔|立绘|战斗/],
    ['超写实', /超写实|写实|半写实|真实/]
  ];

  /* ---------------- 工具 ---------------- */
  const U = {
    uniq: a => Array.from(new Set(a)),
    clamp: (n, a, b) => Math.max(a, Math.min(b, n)),
    esc: s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
    clean: s => String(s || '').replace(/\s+/g, ' ').trim(),
    // 中文按字、英文按词切分做 bigram
    bigrams(s) {
      const t = String(s || '').toLowerCase().replace(/[，。；、,.!?！？：:\s【】\[\]]/g, '');
      const out = new Set();
      for (let i = 0; i < t.length - 1; i++) out.add(t.slice(i, i + 2));
      return out;
    },
    similarity(a, b) {
      const A = U.bigrams(a), B = U.bigrams(b);
      if (!A.size || !B.size) return 0;
      let inter = 0;
      A.forEach(x => { if (B.has(x)) inter++; });
      return inter / (A.size + B.size - inter);
    }
  };

  /* ---------------- 参数联动 ---------------- */
  function h3Frames(sec) {
    // 帧数必须 17n+5，上限 362
    const target = Math.round(sec * 24);
    let best = 124, bd = Infinity;
    for (let n = 0; n <= 21; n++) {
      const f = 17 * n + 5;
      if (f > 362) break;
      const d = Math.abs(f - target);
      if (d < bd) { bd = d; best = f; }
    }
    return best;
  }

  function resolve(modelId, state) {
    const m = MODELS[modelId];
    const table = RES[m.resKey] || {};
    // 该模型不支持当前画幅时回退到第一个可用值，避免参数空白
    const res = table[state.aspect] || table[Object.keys(table)[0]] || '';
    const out = {
      model: m.name,
      res,
      steps: m.params.steps,
      cfg: m.params.cfg,
      sampler: m.params.sampler,
      scheduler: m.params.scheduler,
      denoise: m.params.denoise,
      aspect: state.aspect
    };
    if (m.kind === 'video') {
      const sec = Number(state.duration) || 5;
      const f = h3Frames(sec);
      out.duration = sec + 's';
      out.frames = f;
      out.realDuration = (f / 24).toFixed(2) + 's';
      out.fps = 24;
    }
    out.multiple = m.multiple;
    return out;
  }

  /* ---------------- 组装 ---------------- */
  function build(state) {
    const m = MODELS[state.model];
    const order = ORDER[state.model] || ORDER['z-turbo'];
    const filled = {};
    SEGMENTS.forEach(s => { filled[s.k] = U.clean(state.seg[s.k]); });

    const mk = (key, useSlot) => {
      const seg = SEGMENTS.find(s => s.k === key);
      const v = filled[key];
      if (seg.slot) return useSlot ? (v ? `【${seg.slot}】${v}` : '') : (v || `【${seg.slot}】`);
      return v ? `${seg.para}：${v}` : '';
    };

    // ---- 视频 / 中文结构化 ----
    if (state.model === 'h3' || state.model === 'z-turbo' || state.model === 'z-base') {
      const head = [];
      ['subject', 'feature', 'outfit', 'action', 'scene'].forEach(k => {
        const v = filled[k];
        if (v) head.push(v);
      });
      let s = head.join('，');
      const tail = [];
      ['camera', 'light', 'style', 'quality', 'sound'].forEach(k => {
        if (order.indexOf(k) < 0) return;
        const seg = SEGMENTS.find(s => s.k === k);
        if (!filled[k]) return;
        // 值本身已经以段落名开头（如「镜头缓慢推进」）时不再加「镜头：」前缀，避免重复
        let v = filled[k];
        if (v.indexOf(seg.para) === 0 && v.length > seg.para.length + 2) {
          v = v.slice(seg.para.length).replace(/^[\s：:]+/, '');
        }
        tail.push(`${seg.para}：${v}`);
      });
      if (tail.length) s = (s ? s.replace(/[。.]$/, '') + '。' : '') + tail.join('。') + '。';
      else if (s && !/[。！？]$/.test(s)) s += '。';
      return { text: s, mode: 'zh' };
    }

    // ---- 编辑指令 ----
    if (state.model === 'z-edit') {
      const parts = [];
      if (filled.outfit) parts.push(`服装整体改为：${filled.outfit}`);
      if (filled.feature) parts.push(`人物呈现：${filled.feature}`);
      if (filled.scene) parts.push(`背景改为：${filled.scene}`);
      if (filled.light) parts.push(`光影改为：${filled.light}`);
      if (filled.style) parts.push(`整体风格转为：${filled.style}`);
      let s = parts.join('；');
      if (s) s += '。';
      return { text: s, mode: 'edit' };
    }

    // ---- SDXL / Flux 英文关键词 ----
    const arr = [];
    order.forEach(k => { if (filled[k]) arr.push(filled[k]); });
    const txt = arr.join(', ').replace(/，/g, ', ').replace(/,\s*,/g, ',').replace(/\s{2,}/g, ' ').trim();
    return { text: txt, mode: 'en' };
  }

  // 模板版（槽位保留占位符，用于沉淀成库条目）
  function buildTemplate(state) {
    const m = MODELS[state.model];
    if (state.model === 'z-edit') return build(state).text;
    const order = ORDER[state.model] || ORDER['z-turbo'];
    const arts = [];
    ['subject', 'feature', 'outfit', 'action', 'scene'].forEach(k => {
      if (order.indexOf(k) < 0) return;
      const seg = SEGMENTS.find(s => s.k === k);
      if (seg.slot) arts.push(`【${seg.slot}】`);
      else if (U.clean(state.seg[k])) arts.push(U.clean(state.seg[k]));
    });
    let s = arts.join('，');
    const tail = [];
    ['camera', 'light', 'style', 'quality', 'sound'].forEach(k => {
      if (order.indexOf(k) < 0) return;
      const seg = SEGMENTS.find(s => s.k === k);
      if (U.clean(state.seg[k])) tail.push(`${seg.para}：${U.clean(state.seg[k])}`);
    });
    if (tail.length) s += '。' + tail.join('。') + '。';
    return s;
  }

  /* ---------------- 体检 ---------------- */
  function lint(state, text, opt) {
    const m = MODELS[state.model];
    const raw = text || build(state).text;
    const isTpl = !!(opt && opt.tpl);
    const out = [];
    const add = (lv, msg, hint, fix) => out.push({ lv, msg, hint, fix });

    if (!U.clean(raw)) { add('info', '还没有填写内容', '从左侧槽位开始，或点「随机灵感」'); return out; }
    if (raw.length < 30) add('warn', '提示词过短（' + raw.length + ' 字）', '至少写清 主体 + 场景 + 光线，否则模型会自由发挥');

    // 通用格式
    if (/[（(][^）)]*:\s*\d*\.?\d+\s*[）)]/.test(raw) && !m.weights)
      add('err', '含权重括号语法 (xxx:1.2)', m.name + ' 不支持权重语法，权重会被当成普通文字', 'stripWeight');
    if (/--(ar|v|stylize|quality|style|chaos|seed)\b/i.test(raw) && !m.ar)
      add('err', '含 --ar 等 Midjourney 参数', '画幅请用分辨率控制，参数写进提示词会被当成文字', 'stripAr');
    // 残留占位符（模板版本来就是占位符，跳过）
    const left = (raw.match(/【[^】]{1,8}】/g) || []);
    if (left.length && !isTpl) add('err', '残留 ' + left.length + ' 个未替换占位符：' + U.uniq(left).join(' '), '这些会被模型当成文字画出来', null);

    // 负面词
    const negHits = (raw.match(/不要|禁止|避免|不能|没有|无文字|无logo|no\s+\w+|without/gi) || []);
    if (negHits.length) {
      if (!m.negative) add('err', '出现 ' + negHits.length + ' 处否定表述：' + U.uniq(negHits).slice(0, 4).join('、'), m.name + ' 负面提示词无效，否定词会被忽略甚至反向强化', 'positive');
      else add('warn', '出现 ' + negHits.length + ' 处否定表述', '建议移到独立负面提示词框，正文只写正面描述', 'positive');
    }

    // 泛词
    const vague = VAGUE_KEYS.filter(w => raw.indexOf(w) >= 0);
    if (vague.length) add('info', '可升级的泛词：' + vague.join('、'), '换成更具体的描述，出图稳定性明显提升', 'upgrade');

    // 长度上限
    if (raw.length > 500 && m.id === 'z-turbo') add('warn', '提示词 ' + raw.length + ' 字，偏长', 'Turbo 8 步对长提示词的注意力分配有限，建议压到 300 字内');

    // 模型专属
    if (m.id === 'z-turbo') {
      if (/文字|字幕|logo|海报|标题|排版|UI/i.test(raw)) add('warn', '含文字/排版类描述', 'Turbo 8 步渲染文字容易糊，建议切 Z-Image Base（30 步 / CFG 4.0）');
      const res = resolve('z-turbo', state).res;
      if (res) {
        const [w, h] = res.split('×').map(Number);
        if (w * h / 1e6 > 4.05) add('err', '分辨率 ' + res + ' 超过 4MP 上限', 'Turbo 原生上限约 4MP（2048²）');
        if (w % 16 || h % 16) add('err', '分辨率不是 16 的倍数', '宽高必须取 16 的倍数，否则会崩边');
      }
      if (state.seg.feature && state.seg.feature.length < 12) add('info', '人物特征描述偏薄', '至少写 脸型 + 眼型 + 肤质 + 发型 四要素，否则五官每次都不同');
    }

    if (m.id === 'h3') {
      if (!U.clean(state.seg.sound) && !/声音[：:]/.test(raw))
        add('err', '没有声音描述', 'H3 提示词结尾不写「声音：」，输出是静音的', 'addSound');
      if (/声音[：:]/.test(raw) && raw.lastIndexOf('声音：') < raw.length - 90)
        add('warn', '声音段不在结尾', '把「声音：」放到最后一句，模型对尾部权重更高');
      const cams = ['推近', '拉远', '摇镜', '横移', '跟拍', '环绕', '升', '降', '变焦', '手持'];
      const hit = cams.filter(c => raw.indexOf(c) >= 0);
      if (hit.length > 1) add('warn', '一条提示词出现 ' + hit.length + ' 种运动：' + hit.join('、'), '一条镜头只写一种运动，多种运动会互相打架');
      if (!/定格|结尾|最终|停在|收束|渐隐/.test(raw)) add('warn', '没有写结束状态', '不写结束状态，结尾画面会飘；补一句「结尾定格在…」');
      const d = Number(state.duration) || 5;
      if (d > 15) add('err', '时长 ' + d + 's 超过 H3 上限', 'H3 单次最长 15s（362 帧）');
      if (d < 4) add('warn', '时长 ' + d + 's 偏短', 'H3 建议 4–15s');
      const res = resolve('h3', state).res;
      if (res) {
        const [w, h] = res.split('×').map(Number);
        if (w % 32 || h % 32) add('err', '分辨率不是 32 的倍数', 'H3 宽高必须取 32 的倍数');
      }
    }

    if (m.id === 'z-edit') {
      if (/保留|不要改变|保持不变|维持原样/.test(raw))
        add('warn', '含「保留 / 不要改变」类句式', '编辑模型会自动保留非编辑区，这类句子反而干扰指令理解，建议删掉');
      if (!/改为|换成|转为|改成/.test(raw))
        add('info', '缺少明确的「改为」指令', '编辑指令要写成「X 改为 Y」的目标状态描述');
      if (state.denoise && Number(state.denoise) > 0.9)
        add('warn', 'denoise ' + state.denoise + ' 偏高', '高于 0.9 会连人脸一起重绘；换脸务必放在换装换景之后单独做');
    }

    if (m.id === 'sdxl') {
      if (/[\u4e00-\u9fa5]/.test(raw)) add('warn', '检测到中文', 'SDXL / Flux 对英文关键词响应更准，建议切英文或中英混排');
      if (!U.clean(state.negative)) add('info', '负面提示词为空', 'SDXL 建议填基础负面：lowres, bad anatomy, extra fingers, watermark');
    }

    // 场景四层
    if (state.seg.scene && !/地面|地板|地砖|水面|沙地|草地|地毯/.test(state.seg.scene))
      add('info', '场景缺「地面」层', '换背景类必写满 地面 + 中景 + 远景 + 光线 四层，只写「户外」必糊');

    // 矛盾
    if (/(白天|正午|阳光明媚)/.test(raw) && /(霓虹|深夜|午夜)/.test(raw))
      add('warn', '时间描述可能矛盾（白天 + 霓虹/深夜）', '确认是黄昏蓝调时刻还是夜景，二者光比差很大');

    if (!out.some(x => x.lv === 'err' || x.lv === 'warn')) add('ok', '没有发现硬伤', '可以出图了，建议固定 seed 做横向对比');
    return out;
  }

  /* ---------------- 完整度评分 ---------------- */
  function score(state, text) {
    const raw = text || build(state).text;
    const slots = ['subject', 'feature', 'outfit', 'scene'];
    const filledSlots = slots.filter(k => U.clean(state.seg[k]));
    const a = filledSlots.length * 10;                       // 0–40
    const b = U.clamp(Math.round(raw.length / 10), 0, 25);    // 0–25 细节量（250 字满分）
    const mods = ['action', 'camera', 'light', 'style', 'quality'];
    const c = Math.round(mods.filter(k => U.clean(state.seg[k])).length / mods.length * 20);
    const vagueHits = VAGUE_KEYS.filter(w => raw.indexOf(w) >= 0).length;
    const d = raw.trim() ? U.clamp(15 - vagueHits * 3, 0, 15) : 0;
    return {
      total: U.clamp(a + b + c + d, 0, 100),
      parts: [
        { label: '槽位覆盖 4/4', v: a, max: 40 },
        { label: '细节密度 ' + raw.length + ' 字', v: b, max: 25 },
        { label: '段落完整 ' + mods.filter(k => U.clean(state.seg[k])).length + '/5', v: c, max: 20 },
        { label: '用词具体度', v: d, max: 15 }
      ]
    };
  }

  /* ---------------- 文本分解（库条目 → 槽位） ---------------- */
  function classifyClause(c) {
    // 先跑英文规则（英文提示词常以逗号分隔，靠关键词判断语义段）
    if (/\d+\s?mm\b|close-?up|wide[- ]angle|full[- ]body|depth of field|\bbokeh\b|low angle|high angle|aerial|top[- ]down|medium shot/i.test(c)) return 'camera';
    if (/\bwearing\b|\bdressed in\b|\boutfit\b/i.test(c)) return 'outfit';
    if (/\blight(ing)?\b|\blit\b|golden hour|\bsunset\b|\bneon\b|\brim\b|backlit|\bsoftbox\b|volumetric|window light/i.test(c)) return 'light';
    if (/\b8k\b|\b4k\b|highly detailed|ultra[- ]detailed|\bhdr\b|sharp focus|film grain|\braw\b/i.test(c)) return 'quality';
    if (/\bcinematic\b|photorealistic|\banime\b|oil painting|3d render|\bstyle\b|illustration/i.test(c)) return 'style';

    // 中文规则
    if (/^(镜头|视角|构图)[：:]/.test(c) || /\d+mm|特写|全景|中景|近景|远景镜头|俯拍|仰拍|平视|鸟瞰|景深/.test(c)) return 'camera';
    if (/^(光影|光线|照明)[：:]/.test(c) || /伦勃朗光|蝴蝶光|侧逆光|侧光|顶光|逆光|顺光|补光|环境光|丁达尔|黄金时刻|柔光|硬光|灯光/.test(c)) return 'light';
    if (/^(风格|画风)[：:]/.test(c)) return 'style';
    if (/^(画质|质感)[：:]/.test(c) || /8k|8K|高细节|锐利|胶片颗粒/.test(c)) return 'quality';
    if (/^(声音|音效)[：:]/.test(c)) return 'sound';
    if (/女性|男人|女人|少女|女孩|男孩|老人|男子|女子|人物|模特|主角/.test(c)) return 'feature';
    if (/脸|眼|发|肤|五官|唇|眉|妆|身材|气质|少女感|雀斑|梨涡/.test(c)) return 'feature';
    if (/穿|服装|裙|西装|汉服|旗袍|和服|外套|衬衫|针织|鞋|配饰|项链|耳环|发簪|面料|丝|缎/.test(c)) return 'outfit';
    if (/站|坐|走|跑|回眸|奔|跳|手|姿态|凝视|倚|躺|蹲|转身/.test(c)) return 'action';
    if (/街|房间|室内|户外|背景|天空|森林|城市|咖啡|窗|雨|夜|海边|山|雪|古镇|天桥/.test(c)) return 'scene';
    return 'subject';
  }

  function decompose(prompt) {
    const seg = { subject: '', feature: '', outfit: '', action: '', scene: '', camera: '', light: '', style: '', quality: '', sound: '' };
    const buckets = {};
    const tagMap = {
      镜头: 'camera', 构图: 'camera', 视角: 'camera',
      光影: 'light', 光线: 'light', 照明: 'light',
      风格: 'style', 画风: 'style', 色调: 'style',
      画质: 'quality', 质感: 'quality', 材质: 'quality',
      声音: 'sound', 音效: 'sound',
      动作: 'action', 姿态: 'action', 场景: 'scene', 环境: 'scene'
    };
    const src = String(prompt || '');
    // 有句号按句读；没有句号（常见于中文口语句式）则按全角逗号拆，否则整段会被塞进单一槽位
    const parts = /[。；;]/.test(src)
      ? src.split(/[。；;]+|,/)
      : (src.length > 30 ? src.split(/[，,、]+/) : [src]);
    parts
      .map(c => c.replace(/^[\s，,、:：\-]+|[\s，,、:：\-]+$/g, ''))
      .filter(c => c.length > 1)
      .forEach(c => {
        let key, val;
        const m = c.match(/^(镜头|构图|视角|光影|光线|照明|风格|画风|色调|画质|质感|材质|声音|音效|动作|姿态|场景|环境)[：:]\s*(.+)$/);
        if (m) { key = tagMap[m[1]]; val = m[2]; }
        else {
          val = c.replace(/^【[^】]{1,8}】\s*[:：]?\s*/, '');
          key = classifyClause(c);
        }
        val = val.replace(/^[\s，,、:：]+/, '').trim();
        if (!val) return;
        (buckets[key] = buckets[key] || []).push(val);
      });
    Object.keys(buckets).forEach(k => { seg[k] = buckets[k].join('，'); });
    return seg;
  }

  /* ---------------- 采集解析 ---------------- */
  function detectSource(raw) {
    if (/--(ar|v|stylize|niji)\b/i.test(raw)) return { key: 'midjourney', label: 'Midjourney' };
    if (/[（(][^）)]*:\s*\d*\.?\d+\s*[）)]/.test(raw)) return { key: 'sd', label: 'Stable Diffusion / SDXL' };
    const en = (raw.match(/[a-zA-Z]{3,}/g) || []).length;
    const zh = (raw.match(/[\u4e00-\u9fa5]/g) || []).length;
    if (en > zh / 3) return { key: 'sdxl', label: '英文提示词（SDXL / Flux / MJ）' };
    return { key: 'zimage', label: '中文结构化（Z-Image 系 / H3）' };
  }

  function stripNoise(raw) {
    const notes = [];
    let t = String(raw || '');
    // Midjourney 的 --no 是负面词，必须先摘掉，否则会污染后面的断句
    const no = t.match(/--no\s+[^-]*/gi);
    if (no) { t = t.replace(/--no\s+[^-]*/gi, ' '); notes.push('移除 --no 负面词 ' + no.length + ' 段'); }
    const w = t.match(/[（(][^）)]*:\s*\d*\.?\d+\s*[）)]/g);
    if (w) { t = t.replace(/[（(][^）)]*:\s*\d*\.?\d+\s*[）)]/g, m => m.replace(/[（(]|:\s*\d*\.?\d+\s*[）)]/g, '')); notes.push('去权重括号 ' + w.length + ' 处'); }
    const a = t.match(/--(ar|v|stylize|quality|style|chaos|seed|niji)\s*[\w:.]+/gi);
    if (a) { t = t.replace(/--(ar|v|stylize|quality|style|chaos|seed|niji)\s*[\w:.]+/gi, ''); notes.push('去 MJ 参数 ' + a.length + ' 处'); }
    if (/\b(8k|4k|uhd|hd)\b/i.test(t)) notes.push('含分辨率修饰词（保留）');
    return { text: U.clean(t.replace(/\s{2,}/g, ' ')), notes };
  }

  function negativeToPositive(raw) {
    let t = String(raw || '');
    let n = 0;
    Object.keys(NEG_MAP).forEach(k => { if (t.indexOf(k) >= 0) { t = t.split(k).join(NEG_MAP[k]); n++; } });
    return { text: t, n };
  }

  /* ------------------------------------------------------------------
   * 生视频条目解析（v3.1）
   * 视频提示词是「主体+动作+镜头+光线+声音」的线性叙事，没有标签段落，
   * 直接套生图的 decompose 会把整段塞进单一槽位。这里单独处理：
   *   1) 先把「声音：/配乐：/环境音：…」整块摘出（含其后同一句的补充）
   *   2) 剩余按句切块，块内再按中英文逗号细切
   *   3) 以【槽位名】开头的子句强制归位
   * ------------------------------------------------------------------ */
  /* 视频专用分类：在通用分类器之上补几条视频常见的说法 */
  function classifyVideoClause(c) {
    // 纯约束句，没有对应槽位（保持比例/锁定机位/无字幕…）
    if (/^(保持|锁定|禁止|不出现|无(字幕|标志|文字|配乐|变速|切镜))/.test(c)) return null;
    if (/阳光|夕照|晨光|月光|天光|暮色|暖光|冷光|霓虹灯|霓虹招牌|霓虹光|灯光|照明|逆光|侧光|顶光|自然光/.test(c)) return 'light';
    if (/微距|推近|拉远|跟拍|环绕|摇镜|滑动|固定镜头|机位|运镜|特写|切至|升降|甩镜|俯冲|平移/.test(c)) return 'camera';
    if (/展开|抖动|伸展|停步|跃过|冲刺|滑步|摆动|扑向|握住|伸向|蓄力|转身回眸/.test(c)) return 'action';
    return classifyClause(c);
  }

  function decomposeVideo(prompt) {
    const seg = { subject: '', feature: '', outfit: '', action: '', scene: '', camera: '', light: '', style: '', quality: '', sound: '' };
    let src = String(prompt || '');

    // 1) 声音块：标签出现后，直到该句结束都算声音描述
    const sounds = [];
    src = src.replace(/(声音|音效|环境音|背景音|配乐)\s*[：:]\s*([^。；;]*)[。；;]?/g, (m, tag, body) => {
      let t = body.trim().replace(/^[，,、]+|[，,、]+$/g, '');
      // 「声音：环境音：。」这类重复标签，剥掉内层标签
      t = t.replace(/^(声音|音效|环境音|背景音|配乐)\s*[：:]\s*/, '').replace(/[：:]\s*$/, '').trim();
      if (t.length > 1) sounds.push(t);
      return '。';
    });
    // 「无配乐 / 无额外配乐」这类收尾也要带走
    src = src.replace(/[，,]\s*无(额外)?配乐/g, () => { sounds.push('无配乐'); return ''; });

    // 2) 细切。先把【】内的逗号保护起来，否则「【动作，如水珠滑落】」会被切碎
    const PROT = '\u0001';
    src = src.replace(/【[^】]*】/g, mm => mm.replace(/[，,、]/g, PROT));
    const parts = [];
    src.split(/[。；;]/).forEach(cls => {
      cls.split(/[，,、]/).forEach(c => {
        const t = c.trim().replace(/^[\s:：\-]+|[\s:：\-]+$/g, '').replace(new RegExp(PROT, 'g'), '，');
        if (t.length > 1) parts.push(t);
      });
    });

    const STD_SLOT = { '主体': 'subject', '人物特征': 'feature', '服饰造型': 'outfit', '场景环境': 'scene' };

    // 一个子句里可能嵌多个槽位标记（模板版条目常见）：【主体】站在【场景环境】窗边
    // → 在第二个标记处再切一次，否则残留的【】会跟着内容进槽
    const splitMarks = c => {
      const marks = [];
      const re = /【([^】]{1,40})】/g;
      let m;
      while ((m = re.exec(c))) marks.push({ name: m[1], start: m.index, end: m.index + m[0].length });
      if (!marks.length) return [{ mark: null, text: c }];
      const out = [];
      if (marks[0].start > 0) out.push({ mark: null, text: c.slice(0, marks[0].start) });
      marks.forEach((x, i) => {
        const next = i + 1 < marks.length ? marks[i + 1].start : c.length;
        out.push({ mark: x.name, text: c.slice(x.end, next) });
      });
      return out;
    };

    const buckets = {};
    // 主体定位：中文视频提示词几乎都写「一只鹦鹉 / 一双手 / 一列列车」，
    // 这个信号比句首位置可靠得多（状语常在前，主体在后）
    const SUBJ_RE = /^[一这那][只列把双位个件座辆张条匹头群排名副碗杯盘朵株棵片块根支枝台架艘间扇枚颗粒滴缕束团堆份套对串叠瓶盒袋包篮筐桶锅顶面幅帧幕道栋层户所处场]/;
    let subjIdx = -1;
    for (let i = 0; i < parts.length; i++) {
      const bare = parts[i].replace(/^【[^】]{1,40}】/, '').trim();
      if (SUBJ_RE.test(bare) && bare.length > 3) { subjIdx = i; break; }
    }
    // 兜底：没有数量词时，第一个非修饰性描述当主体
    let headSeen = subjIdx >= 0;

    parts.forEach((c, pi) => {
      splitMarks(c).forEach(piece => {
        let val = piece.text.replace(/^[\s，,、:：]+|[\s，,、:：]+$/g, '');
        // 标记后面没内容的模板占位符（如【动作，如水珠滑落】）→ 把它当填写提示放进槽里
        if (val.length < 1) {
          if (piece.mark && /[，,]/.test(piece.mark)) {
            const mapped = SLOT_ALIAS[piece.mark] || piece.mark;
            const k = STD_SLOT[mapped] || classifyClause(piece.mark);
            (buckets[k] = buckets[k] || []).push('【' + piece.mark + '】');
          }
          return;
        }

        // 有槽位标记：先按语义分类，判不出再用标记兜底
        // （「【主体】站在…」里的“站在”是动作，不该被塞进主体槽）
        let key = classifyVideoClause(val);
        if (key === null) return;                         // 纯约束句
        if (piece.mark && key === 'subject') {
          const mapped = SLOT_ALIAS[piece.mark] || piece.mark;
          key = STD_SLOT[mapped] || 'subject';
        }

        // 数量词命中的那条 → 强制当主体
        if (pi === subjIdx && !piece.mark) {
          key = 'subject';
        } else if (!headSeen && !piece.mark) {
          headSeen = true;
          if (key === 'scene' || key === 'feature' || key === 'outfit') key = 'subject';
        } else if (key !== 'subject' || piece.mark) {
          headSeen = true;
        }

        // 视频里的硬约束句（无变速、无切镜、保持稳定…）不属于任何画面槽位，丢掉
        if (/^(无变速|无切镜|无文字|无突变|无转场|自然尺度|保持[^，]{0,16}(稳定|比例|一致|不变|固定)|不出现[^，]{0,8})$/.test(val)) return;
        // 氛围/调性词比「主体」更适合后者
        if (key === 'subject' && /氛围|调性|电影感|影调/.test(val)) key = 'style';
        (buckets[key] = buckets[key] || []).push(val);
      });
    });

    Object.keys(buckets).forEach(k => { seg[k] = buckets[k].join('，'); });
    if (sounds.length) {
      const sm = sounds.join('；');
      seg.sound = seg.sound ? sm + '；' + seg.sound : sm;
    }
    return seg;
  }

  function analyzeIngest(raw) {
    const src = detectSource(raw);
    const noised = stripNoise(raw);
    const pos = negativeToPositive(noised.text);
    const seg = decompose(pos.text);
    const slots = ['subject', 'feature', 'outfit', 'scene'].filter(k => seg[k]);
    const len = pos.text.length;
    // 用「有效信息块」口径：实体槽位 + 段落修饰，避免中文整句被归到 feature 后误判为 C
    const mods = ['action', 'camera', 'light', 'style', 'quality'].filter(k => seg[k]).length;
    const rich = slots.length + mods;
    let sc = 'B';
    if (rich >= 5 && len > 55 && pos.n === 0) sc = 'A';
    if (rich <= 2 || len < 30) sc = 'C';

    // 去重
    const pool = LIB.image.concat(LIB.video);
    const dups = pool
      .map(p => ({ id: p.id, name: p.name, sim: U.similarity(pos.text, p.prompt) }))
      .sort((a, b) => b.sim - a.sim)
      .slice(0, 3)
      .filter(x => x.sim > 0.15);

    return { src, notes: noised.notes, posFixed: pos.n, text: pos.text, seg, slots, score: sc, dups, len };
  }

  /* ---------------- 随机灵感 ---------------- */
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function lexWords(dim) {
    const x = LIB.lexicon.find(l => l.dim === dim);
    return x ? x.words : [];
  }
  function randomState(base) {
    const seg = Object.assign({}, base.seg);
    const put = (k, dims, n) => {
      const pool = [];
      dims.forEach(d => pool.push.apply(pool, lexWords(d)));
      if (!pool.length) return;
      const arr = [];
      for (let i = 0; i < n; i++) { const w = pick(pool); if (arr.indexOf(w) < 0) arr.push(w); }
      seg[k] = arr.join('，');
    };
    put('subject', ['人像身份职业'], 1);
    put('feature', ['脸型轮廓', '眼睛眼型', '肤质肌理', '发型'], 4);
    put('outfit', ['服装品类', '面料材质', '配色'], 3);
    put('action', ['姿势动作'], 1);
    put('scene', ['地点场所', '时间', '背景元素'], 3);
    put('camera', ['镜头构图'], 1);
    put('light', ['光线'], 1);
    put('style', ['风格流派'], 1);
    put('quality', ['画面质感'], 1);
    if (MODELS[base.model].kind === 'video') seg.sound = '环境音：' + pick(SOUND_CHIPS) + '，' + pick(SOUND_CHIPS);
    return Object.assign({}, base, { seg });
  }

  /* ---------------- 变体 ---------------- */
  function variants(state, n) {
    n = n || 3;
    const out = [];
    const alts = {
      light: ['伦勃朗光', '窗边侧光', '黄金时刻暖光', '霓虹环境光', '柔光箱正面光', '侧逆光'],
      camera: ['85mm 人像中景', '50mm 半身平视', '24mm 广角低机位', '长焦特写压缩背景', '俯拍全景'],
      style: ['胶片质感', '电影感青橙调', '清透日系', '低饱和高级灰', '复古油画']
    };
    for (let i = 0; i < n; i++) {
      const s = Object.assign({}, state, { seg: Object.assign({}, state.seg) });
      s.seg.light = pick(alts.light);
      s.seg.camera = pick(alts.camera);
      s.seg.style = pick(alts.style);
      out.push({ seg: s.seg, text: build(s).text, key: s.seg.light + ' / ' + s.seg.camera });
    }
    return out;
  }

  /* ---------------- 检索计划 ---------------- */
  function searchPlan(opts) {
    const { model, type, tags } = opts;
    const m = MODELS[model];
    const base = m.kind === 'video'
      ? ['Z-Image 生视频 提示词', 'MiniMax H3 提示词 案例', 'H3 T2VA I2VA 实测']
      : ['Z-Image 提示词', 'Z-Image Turbo 提示词 案例', 'Z-Image 人像 提示词'];
    const g = (tags || []).slice(0, 3);
    const qs = [];
    base.forEach(b => {
      if (g.length) g.forEach(t => qs.push(b + ' ' + t));
      else qs.push(b);
    });
    return {
      queries: U.uniq(qs).slice(0, 9),
      accept: [
        '带完整提示词原文（不是「一句话概括」）',
        '有可验证的热度：收藏 / 点赞 / 使用次数 / 下载量',
        '注明来源链接与日期',
        '结构完整：主体 + 场景 + 光线 至少三层',
        '与库内已有条目相似度 < 0.85（采集器会自动查重）'
      ],
      exclude: [
        '只有效果图、没有提示词的',
        '转述改写过多、看不出原始写法的',
        '明显由 AI 生成的「提示词教程」但没有实拍验证的',
        '含违规或擦边内容的（采集器会拦截）'
      ]
    };
  }

  /* =======================================================================
   * P0-1 · 槽位归一
   * ===================================================================== */
  function normalizeSlots(text) {
    let t = String(text || '');
    const hits = [];
    t = t.replace(/【([^】]{1,16})】/g, (all, name) => {
      const n = name.trim();
      const std = SLOT_ALIAS[n];
      if (std && std !== n) { hits.push(n + '→' + std); return '【' + std + '】'; }
      if (!std && NON_SLOT_TAGS.indexOf(n) >= 0) { hits.push(n + '→（转段落）'); return n + '：'; }
      return all;
    });
    return { text: t, hits: U.uniq(hits) };
  }

  // 从正文提取标准槽位（已归一）
  function slotsOf(prompt) {
    const t = normalizeSlots(prompt).text;
    const found = [];
    (t.match(/【([^】]{1,16})】/g) || []).forEach(x => {
      const n = x.slice(1, -1);
      if (['主体', '人物特征', '服饰造型', '场景环境'].indexOf(n) >= 0 && found.indexOf(n) < 0) found.push(n);
    });
    return found;
  }

  /* =======================================================================
   * P0-2 · 可用模型推断（一条提示词往往不止适配一个模型）
   * ===================================================================== */
  function inferModels(item) {
    const raw = String(item.model || '') + ' ' + String(item.workflow || '') + ' ' + String(item.sampling || '');
    const p = String(item.prompt || '');
    const out = [];
    const push = x => { if (out.indexOf(x) < 0) out.push(x); };

    if (/H3|MiniMax/i.test(raw)) push('h3');
    if (/Base/i.test(raw)) push('z-base');
    if (/Edit|编辑/i.test(raw)) push('z-edit');
    if (/SDXL|Flux|Stable Diffusion/i.test(raw)) push('sdxl');
    if (/Turbo/i.test(raw)) push('z-turbo');

    // 无标注时按提示词特征推断
    if (!out.length) {
      if (/声音[：:]|镜头|运镜/.test(p) && /17n\+5|24fps|H3/.test(raw)) push('h3');
      if (/[\u4e00-\u9fa5]/.test(p)) { push('z-turbo'); }
      if (/文字|排版|海报|信息图|UI/.test(p)) push('z-base');
      if (/^(a |an |the )|,\s*(8k|highly detailed|cinematic)/i.test(p)) push('sdxl');
    }
    if (!out.length) push('z-turbo');
    // 中文结构化 + 无文字类 → Base 也通常能出，标为可选
    if (out.indexOf('z-turbo') >= 0 && /文字|排版|海报|信息图|UI|logo/i.test(p) && out.indexOf('z-base') < 0) push('z-base');
    return out;
  }

  /* =======================================================================
   * P3-1 · 标签三层
   * ===================================================================== */
  function tagPath(tag) {
    const t = String(tag || '');
    const pick = (rules) => {
      for (let i = 0; i < rules.length; i++) if (rules[i][1].test(t)) return rules[i][0];
      return '其他';
    };
    const l1 = pick(TAG_L1);
    let l2 = pick(TAG_L2);
    if (l2 === '其他' && L1_L2[l1]) l2 = L1_L2[l1];
    return { l1, l2, l3: pick(TAG_L3) };
  }

  /* =======================================================================
   * P2-1 · 失败案例库
   * detect 用于装配页实时比对：命中就提示「你可能正在犯 F-xx」
   * ===================================================================== */
