      '<li><b>要排错</b>：库页「失败案例」搜现象，或直接看装配页体检末尾挂出来的 F-xx。</li>' +
      '<li><b>要复用</b>：⌘K 搜任何条目/词/案例；调好的一组设定存成「配方」，下次一键还原。</li>' +
      '<li><b>要体检库</b>：库页「断言套件」跑全库回归，通过率掉了说明新写的东西破坏了规范。</li>' +
      '</ol>' +

      '<h2>六、v3 迭代：从竞品学来的 10 件事</h2>' +
      '<p>完整的 20 家竞品评分、能力矩阵与差异化机会点见「竞品」页。这里只列<b>学完之后动了手</b>的部分。</p>' +
      '<table><tr><th style="width:48px">编号</th><th style="width:190px">学谁</th><th style="width:150px">成熟能力</th><th>在本系统怎么用</th></tr>' +
      BENCH.BORROW.map(b =>
        '<tr><td class="mono">' + b.id + '</td><td class="muted">' + U.esc(b.from) + '</td>' +
        '<td><b>' + U.esc(b.cap) + '</b></td><td>' + U.esc(b.doing) + '</td></tr>').join('') +
      '</table>' +

      '<h2>七、工作区备份</h2>' +
      '<p>版本记录、出图记录、采集队列、配方、自定义 LoRA 都存在浏览器本地。<b>换电脑或清缓存前一定导一次</b>，一个 JSON 带走全部。</p>' +
      '<div class="pv-actions inline"><button class="btn primary" id="btn-backup">导出工作区备份</button>' +
      '<button class="btn" id="btn-restore">导入备份</button>' +
      '<button class="btn" id="btn-wipe">清空本地数据</button>' +
      '<input type="file" id="file-restore" accept=".json" style="display:none"></div>' +
      '<div class="hintline" id="backup-note"></div>' +

      BLUEPRINT_TAIL;

    bindBackup();
  }

  /* ---------------- v3 · 工作区备份与恢复 ---------------- */
  const libIsImported = () => { try { return !!localStorage.getItem('pf.lib'); } catch (e) { return false; } };

  /** 备份体：个人数据 + （若导入过全量库）整库一起带上，换机器一次到位。 */
  function workspace() {
    const w = {
      kind: 'promptforge-workspace', ver: 4, at: new Date().toISOString(),
      state, versions: mem.versions, outputs: mem.outputs, lora: mem.lora,
      ab: mem.ab, queue: mem.queue, customLora: mem.customLora, presets: mem.presets
    };
    if (libIsImported()) {
      w.library = LIB;
      w.libraryAt = (LIB.meta && LIB.meta.builtAt) || '';
    }
    return w;
  }
  /** 把备份 JSON 文本写回本地状态：网页选择框与原生 pfImport 桥共用同一段逻辑。 */
  function applyWorkspaceText(text) {
    try {
      const w = JSON.parse(String(text));
      if (w.kind !== 'promptforge-workspace') throw new Error('文件格式不对');
      if (w.state && w.state.seg) state = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), w.state);
      ['versions', 'outputs', 'lora', 'ab', 'queue', 'customLora', 'presets'].forEach(k => {
        if (w[k] != null) mem[k] = w[k];
      });
      // 备份里带库 → 落到 pf.lib，engine 下次加载优先用它
      const hasLib = w.library && (w.library.image || w.library.video);
      let lexUp = null;
      if (hasLib) {
        /* 词库是工具底座、不是用户数据：备份里的词库若明显落后于本版内置词库，
         * 就用内置词库替换（提示词/编辑工序照旧用备份里的），避免导旧备份把词库打回老版本。 */
        try {
          const bl = (window.__LIB__ && window.__LIB__.lexicon) || [];
          const cnt = a => (Array.isArray(a) ? a : []).reduce((s, d) => s + ((d && d.words) ? d.words.length : 0), 0);
          const oldN = cnt(w.library.lexicon), newN = cnt(bl);
          if (newN > oldN * 1.15) {
            w.library.lexicon = bl;
            lexUp = oldN + ' → ' + newN;
          }
        } catch (e) { }
        try { localStorage.setItem('pf.lib', JSON.stringify(w.library)); } catch (e) {
          throw new Error('库太大，写入本地失败（' + e.message + '）');
        }
      }
      save(); persist();
      if (hasLib) {
        const n = (w.library.image || []).length + (w.library.video || []).length;
        const obj = (w.library.edits || []).length;
        try {
          localStorage.setItem('pf.flash', '已导入备份：库 ' + n + ' 条提示词' +
            (obj ? ' + ' + obj + ' 条编辑工序' : '') + '，个人数据已恢复' +
            (lexUp ? '；词库已升级为本版（' + lexUp + ' 词）' : ''));
        } catch (e) { }
        location.reload();
        return true;
      }
      route('compose');
      toast('已恢复 ' + (w.at || '').slice(0, 10) + ' 的备份');
      return true;
    } catch (err) {
      toast('恢复失败：' + err.message);
      return false;
    }
  }
  // 原生壳读取文件后回注；失败时用 pfRestoreFail 提示原因
  window.pfRestore = applyWorkspaceText;
  window.pfRestoreFail = msg => toast('恢复失败：' + msg);

  function bindBackup() {
    const n = $('#backup-note');
    if (n) {
      const libN = (LIB.image || []).length + (LIB.video || []).length;
      n.innerHTML = '当前本地：版本 <b>' + Object.keys(mem.versions).reduce((a, k) => a + mem.versions[k].length, 0) +
        '</b> 条 · 出图记录 <b>' + Object.keys(mem.outputs).reduce((a, k) => a + mem.outputs[k].length, 0) +
        '</b> 条 · 配方 <b>' + mem.presets.length + '</b> 个 · 采集队列 <b>' + mem.queue.length + '</b> 条' +
        ' · 库 <b>' + libN + '</b> 条' +
        (libIsImported() ? '（已导入，会随备份一起带走）' : '（内置示例，备份只带个人数据）');
    }

    const bd = $('#btn-backup');
    if (bd) bd.onclick = () => {
      const w = workspace();
      download('promptforge-workspace-' + today() + '.json', JSON.stringify(w), 'application/json');
      toast(w.library ? '备份已下载（含库 ' + ((w.library.image || []).length + (w.library.video || []).length) + ' 条）'
        : '备份已下载，换电脑时导入即可');
    };
    // 原生壳里 WKWebView 不给 <input type=file> 弹面板（未实现 WKUIDelegate 时按「取消」处理），
    // 所以壳里改走 pfImport 桥让原生开系统选择框；浏览器与云端页面仍用网页选择框。
    const rs = $('#btn-restore'), fi = $('#file-restore');
    if (rs) rs.onclick = () => {
      const imp = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.pfImport;
      if (imp) {
        try { imp.postMessage({}); return; } catch (e) { /* 桥异常时退回网页选择框 */ }
      }
      fi.click();
    };
    if (fi) fi.onchange = e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => applyWorkspaceText(r.result);
      r.readAsText(f);
    };
    const wp = $('#btn-wipe');
    if (wp) wp.onclick = () => {
      const hadLib = libIsImported();
      const msg = hadLib
        ? '清空本地数据，并把导入的库退回内置示例库？建议先导出备份。'
        : '清空浏览器里存的全部本地数据（不影响库文件）？建议先导出备份。';
      if (!confirm(msg)) return;
      mem = { versions: {}, outputs: {}, lora: {}, ab: {}, queue: [], customLora: [], presets: [] };
      state = JSON.parse(JSON.stringify(DEFAULT));
      persist(); save();
      if (hadLib) {
        try { localStorage.removeItem('pf.lib'); localStorage.setItem('pf.flash', '已清空本地数据，库已退回内置示例'); } catch (e) { }
        location.reload();
        return;
      }
      route('compose'); toast('已清空本地数据');
    };
  }

  /* ---------------- 启动 ---------------- */
  function init() {
    document.addEventListener('click', onChipClick);

    /* 命令面板 */
    document.addEventListener('keydown', e => {
      const pal = $('#palette');
      const open = pal && !pal.classList.contains('hide');
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); open ? closePalette() : openPalette(); return;
      }
      if (!open) return;
      if (e.key === 'Escape') { closePalette(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); palIdx = Math.min(palIdx + 1, palRows.length - 1); palMark(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); palIdx = Math.max(palIdx - 1, 0); palMark(); }
      else if (e.key === 'Enter') {
        const r = palRows[palIdx]; if (r) { closePalette(); r.go(); }
      }
    });
    document.addEventListener('click', e => {
      if (e.target.closest('.pal-bg')) closePalette();
      if (e.target.closest('#kbd-hint')) openPalette();
    });
    document.addEventListener('input', e => {
      if (e.target.id === 'pal-q') { palIdx = 0; palRender(e.target.value); }
    });
    document.addEventListener('input', function (e) {
      const el = e.target.closest('[data-seg]');
      if (!el) return;
      const k = el.dataset.seg;
      if (!(k in state.seg)) return;
      state.seg[k] = el.value;
      manualText = null;
      save(); refreshMeta(); syncPreview();
    });
    renderShell(); renderTabs(); route('compose');
    // 导入/清空后页面会 reload，用它把结果提示带过来
    try {
      const flash = localStorage.getItem('pf.flash');
      if (flash) { localStorage.removeItem('pf.flash'); setTimeout(() => toast(flash), 400); }
    } catch (e) { }
    document.querySelectorAll('#tabs button[data-tab]').forEach(b => {
      b.onclick = () => route(b.dataset.tab);
    });
  }
  document.addEventListener('DOMContentLoaded', init);
  if (document.readyState !== 'loading') init();
})();

</script>
</body>
</html>
